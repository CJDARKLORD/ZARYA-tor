name: Build tor-android AAR (Java 17)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0   # needed for git describe --tags

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK 26.1.10909125
      run: |
        sdkmanager --install "ndk;26.1.10909125"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          autoconf automake libtool pkg-config \
          gettext gperf m4 make git curl \
          libssl-dev libevent-dev zlib1g-dev

    - name: Grant execute permission for gradlew and tor-droid-make.sh
      run: |
        chmod +x ./gradlew
        chmod +x ./tor-droid-make.sh

    - name: Fetch submodules (tor, libevent, openssl, zlib, zstd)
      run: ./tor-droid-make.sh fetch

    - name: Build native libraries (libtor.so etc.) and AAR
      run: |
        export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
        ./tor-droid-make.sh build -b release

    - name: Locate AAR
      run: |
        find . -name "*.aar" -type f

    - name: Upload AAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: tor-android-aar
        path: tor-android-binary/build/outputs/aar/*.aar
        if-no-files-found: error
