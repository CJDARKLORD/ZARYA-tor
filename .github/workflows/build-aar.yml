name: Build tor-android AAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

    - name: Install Android SDK packages
      run: |
        sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Build AAR
      run: ./gradlew :tor-android-binary:assembleRelease

    - name: Upload AAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: tor-android-aar
        path: tor-android-binary/build/outputs/aar/*.aar
