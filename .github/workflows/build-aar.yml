name: Build tor-android AAR

on:
  workflow_dispatch: # Позволяет запускать сборку вручную из вкладки Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive' # Важно для подмодулей (например, hev-socks5-tunnel)[reference:2]

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Android NDK
      uses: android-actions/setup-android@v3
      with:
        ndk-version: '26.1.10909125' # Указываем ту же версию, что и в вашем проекте

    - name: Build AAR
      run: |
        chmod +x ./gradlew
        ./gradlew :tor-android:assembleRelease
      # ВАЖНО: Перед сборкой нужно отредактировать build.gradle в форке
      # (см. пункт 3 ниже)

    - name: Upload AAR
      uses: actions/upload-artifact@v4
      with:
        name: tor-android-aar
        path: tor-android/build/outputs/aar/*.aar # Путь к артефакту может отличаться
